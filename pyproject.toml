[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-reversal"
version = "0.1.0"
description = "A-share reversal strategy research, backtest and scanning toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2", "numpy>=1.24", "pyarrow>=14", "pydantic>=2", "PyYAML>=6", "typer>=0.12", "rich>=13", "matplotlib>=3.7", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
data = ["akshare>=1.17", "tushare>=1.4"]

[project.scripts]
quant-reversal = "quant_reversal.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
